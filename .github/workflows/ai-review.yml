name: AI-Review-Gemini
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini Review
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # 1. 差分を取得してエンコード（特殊文字対策）
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          
          # 2. 指揮書（review.md）の内容を取得
          PROMPT=$(cat .opencode/agent/review.md)

          # 3. Pythonスクリプトを使って確実にGeminiを叩く（シェルスクリプトの限界を回避）
          python3 - <<EOF
          import os
          import json
          import http.client

          api_key = os.environ['GOOGLE_API_KEY']
          with open('diff.txt', 'r') as f:
              diff_text = f.read()
          
          prompt = """$PROMPT"""
          content = prompt + "\n\n以下のコード差分をレビューしてください:\n\n" + diff_text
          
          data = json.dumps({"contents": [{"parts": [{"text": content}]}]})
          
          conn = http.client.HTTPSConnection("generativelanguage.googleapis.com")
          conn.request("POST", f"/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}", data, {"Content-Type": "application/json"})
          res = conn.getresponse()
          result = json.loads(res.read().decode())
          
          with open('ai-review.md', 'w') as f:
              try:
                  f.write(result['candidates'][0]['content']['parts'][0]['text'])
              except:
                  print("APIからの応答が不正です:", result)
          EOF

      - name: PR comment
        if: success() && hashFiles('ai-review.md') != ''
        uses: mshick/add-pr-comment@v2
        with:
          message-path: ai-review.md