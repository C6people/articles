name: AI-Review-Gemini
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }} # Secretの名前と合わせる
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # これを追加！過去の履歴を全部取得して差分を見れるようにします

      - uses: oven-sh/setup-bun@v2
      - run: bun install -g opencode-ai
      
      - name: Run Review
        run: |
          # 差分を一時ファイルに書き出す（特殊文字によるエラーを防ぐため）
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          
          # AIを実行
          opencode run \
            --model=google/gemini-1.5-flash \
            --agent=review \
            --input-file=diff.txt > ai-review.md
            
      - name: PR comment
        # ファイルが存在し、かつ中身がある時だけコメントする
        if: hashFiles('ai-review.md') != ''
        uses: mshick/add-pr-comment@v2
        with:
          message-path: ai-review.md