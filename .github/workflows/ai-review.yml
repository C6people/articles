name: AI-Review-Gemini
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }} # Secretの名前と合わせる
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # これを追加！過去の履歴を全部取得して差分を見れるようにします

      - uses: oven-sh/setup-bun@v2
      - run: bun install -g opencode-ai
      
      - name: Run Review
        run: |
          # 1. 差分を取得
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          
          # 2. 差分が空なら終了
          if [ -z "$DIFF" ]; then
            echo "No changes found."
            exit 0
          fi

          # 3. OpenCodeを実行
          # echoで差分を流し込み、引数を最小限にします
          echo "$DIFF" | opencode run \
            --model google/gemini-1.5-flash \
            --agent review > ai-review.md
            
      - name: PR comment
        # ファイルが存在し、かつ中身がある時だけコメントする
        if: hashFiles('ai-review.md') != ''
        uses: mshick/add-pr-comment@v2
        with:
          message-path: ai-review.md