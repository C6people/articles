name: AI-Review-Debug
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  debug_review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Debug API Call
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. 最小限のテストリクエストを投げる
          # これで「APIキー自体が生きているか」がわかります
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"contents": [{"parts":[{"text": "Hi"}]}]}')
          
          echo "--- APIからの返答ここから ---"
          echo "$RESPONSE"
          echo "--- APIからの返答ここまで ---"

          # 2. もし成功していれば、中身をファイルに保存
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' > ai-review.md || echo "まだエラーが出ています" > ai-review.md

      - name: PR comment
        uses: mshick/add-pr-comment@v2
        with:
          message-path: ai-review.md